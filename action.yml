name: GitHub Action Template
description: Template for building a GitHub Marketplace action on the @effected Effect v4 kit with @savvy-web/github-action-builder
branding:
  icon: package
  color: blue
inputs:
  # This file is the single source of truth for input NAMES and DEFAULTS.
  # `src/schema/inputs.ts` mirrors both, and `__test__/unit/schema/inputs.test.ts`
  # asserts the two never drift: it parses this file, records what the code
  # actually reads, and compares both against the INPUT_NAMES tuple.
  name:
    description: Who to greet. Must not be blank.
    required: false
    default: world
  emphatic:
    description: Whether to greet with an exclamation mark (true | false).
    required: false
    default: "false"
  write-summary:
    description: Whether to append a greeting panel to the job summary (true | false).
    required: false
    default: "true"
  dry-run:
    description: Rehearse the run without performing any mutation (true | false).
    required: false
    default: "false"
outputs:
  greeting:
    description: The rendered greeting. Empty when the run failed before greeting.
  summary-written:
    description: Whether the job summary panel was appended ("true" | "false"). "false" when skipped, dry-run, or degraded.
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
