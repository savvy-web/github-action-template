name: Test
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - src/**
      - dist/**
      - action.yml
      - .github/actions/local/**
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src/**
      - dist/**
      - action.yml
      - .github/actions/local/**
      - .github/workflows/test.yml
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Self-dogfood: the repository runs its own committed action, real runner,
  # real outputs.
  run-action:
    name: Run the action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run this repository's action
        id: demo
        uses: ./
        with:
          name: dogfood
      - name: Assert outputs
        env:
          GREETING: ${{ steps.demo.outputs.greeting }}
          SUMMARY_WRITTEN: ${{ steps.demo.outputs.summary-written }}
        run: |
          test "$GREETING" = "Hello, dogfood."
          test "$SUMMARY_WRITTEN" = "true"
      - name: Run in dry-run mode
        id: rehearsal
        uses: ./
        with:
          name: dogfood
          dry-run: "true"
      - name: Assert dry-run outputs
        env:
          SUMMARY_WRITTEN: ${{ steps.rehearsal.outputs.summary-written }}
        run: |
          test "$SUMMARY_WRITTEN" = "false"
  # Dist freshness: the committed bundles must be the ones this source builds.
  # vitest runs source, never the bundle — this is the only gate that sees a
  # stale or hand-edited dist/.
  dist-freshness:
    name: Dist is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup runtime
        uses: savvy-web/silk-runtime-action@v1
      - name: Rebuild
        run: pnpm ci:build
      - name: Diff committed bundles against the rebuild
        run: git diff --exit-code dist .github/actions/local
