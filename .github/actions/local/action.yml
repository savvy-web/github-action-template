name: GitHub Action Template
description: Template for building a GitHub Marketplace action on the @effected Effect v4 kit with @savvy-web/github-action-builder
branding:
  icon: package
  color: blue
inputs:
  # This file is the single source of truth for input NAMES and DEFAULTS.
  # `src/schema/inputs.ts` mirrors both, and `__test__/unit/schema/inputs.test.ts`
  # asserts the two never drift: it decodes this file (`__test__/utils/manifest.ts`),
  # records what the code actually reads, compares both against the INPUT_NAMES
  # tuple, and decodes the runner-shaped environment (every input present, with
  # its default below or "") to the same values the code's own defaults give.
  name:
    description: Who to greet. Must not be blank.
    required: false
    default: world
  guests:
    description: >-
      More people to greet, as a list — one per line, comma-separated, a `- ` bullet list, or a JSON array; `#` comment lines are ignored. Omit to greet only `name`.
    required: false
  emphatic:
    description: Whether to greet with an exclamation mark (true | false).
    required: false
    default: "false"
  write-summary:
    description: Whether to append a greeting panel to the job summary (true | false).
    required: false
    default: "true"
  dry-run:
    description: Rehearse the run without performing any mutation (true | false).
    required: false
    default: "false"
outputs:
  greeting:
    description: The rendered greeting. Empty when the run failed before greeting.
  result:
    description: >-
      The structured run result, as JSON. Validated by the versioned document the payload names in its own `$schema` field (schemas/<version>/github-action-template-<version>.json); generated from the same Effect Schema the action encodes it through.
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
